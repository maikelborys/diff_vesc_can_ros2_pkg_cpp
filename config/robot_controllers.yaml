# DiffBot VESC Controller Configuration for ROS2 Control
# Compatible with ros2_control framework for differential drive robots

# Controller Manager Configuration
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    
    # Controller type definitions
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      
    diffbot_base_controller:
      type: diff_drive_controller/DiffDriveController

# Joint State Broadcaster Parameters
joint_state_broadcaster:
  ros__parameters:
    # Will publish all available joint states (automatic detection)
    extra_joints: []

# Differential Drive Controller Parameters
diffbot_base_controller:
  ros__parameters:
    # Critical wheel configuration - CANNOT BE EMPTY per ros2_control spec
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]
    
    # Verify joint names match URDF exactly
    # left_wheel_joint and right_wheel_joint as defined in diffbot_vesc.urdf.xacro
    
    # Robot physical parameters
    wheel_separation: 0.370          # meters - distance between wheel centers
    wheel_radius: 0.1778             # meters - wheel radius (diameter 0.3556m)
    wheels_per_side: 1               # One signal per side (required parameter)
    
    # Calibration multipliers
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    
    # Publishing settings
    publish_rate: 50.0               # Hz - odometry publishing frequency
    odom_frame_id: "odom"            # odometry frame name
    base_frame_id: "base_link"       # robot base frame name
    
    # Odometry covariance matrices (6x6 diagonal values)
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    
    # Control behavior
    open_loop: false                 # Use encoder feedback for better accuracy
    position_feedback: true          # Enable position feedback from hardware
    enable_odom_tf: true             # publish odom->base_link transform
    use_stamped_vel: false           # use geometry_msgs/TwistStamped instead of Twist
    
    # Command timeout
    cmd_vel_timeout: 0.5             # seconds - stop robot if no commands received
    
    # Velocity limits for safety
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true  
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 2.0       # m/s
    linear.x.min_velocity: -2.0      # m/s  
    linear.x.max_acceleration: 1.0   # m/s²
    linear.x.min_acceleration: -1.0  # m/s²
    
    # Angular velocity limits
    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false  
    angular.z.max_velocity: 2.0      # rad/s
    angular.z.min_velocity: -2.0     # rad/s
    angular.z.max_acceleration: 1.0  # rad/s²
    angular.z.min_acceleration: -1.0 # rad/s²
